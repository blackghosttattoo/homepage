  // ---- 3. 아티스트 프로필 고치기 (아티스트 본인 / 관리자 공통) ----
  function editor(box, id, opt) {
    opt = opt || {};
    var ref = db.collection('artists').doc(id);
    box.innerHTML = '<p class="spin">불러오는 중…</p>';
    ref.get().then(function (s) {
      if (!s.exists) { box.innerHTML = '<div class="card"><p class="msg">연결된 아티스트 정보가 없어요. 관리자에게 알려 주세요.</p></div>'; return; }
      var a = s.data(), cover = a.cover || a.coverUrl || '';
      box.innerHTML =
        (opt.back ? '<div><button type="button" class="btn btn-sm" data-back>← 아티스트 목록</button></div>' : '') +
        '<div class="head"><div class="eyebrow"><span></span>PROFILE</div><h2 class="slv" style="font-family:Michroma,sans-serif;font-weight:400;letter-spacing:.1em;font-size:clamp(24px,4vw,34px)">' + esc(a.en) + '</h2></div>' +
        '<div class="ed"><div class="ed-cover"><div class="frame" data-cv style="' + bg(cover) + '">' + (cover ? '' : '대표 사진 없음') + '</div>' +
        '<label class="btn btn-sm filebtn wide">대표 사진 바꾸기<input type="file" accept="image/*" data-cf></label>' +
        '<p class="muted" style="font-size:13px">홈페이지 아티스트 목록에 세로(4:5)로 나오는 사진이에요.</p></div>' +
        '<form class="ed-form" data-f>' +
        (admin ? '<div class="two"><label class="f">영어 이름 (화면에 나옴)<input name="en" maxlength="30" required value="' + esc(a.en) + '"></label><label class="f">한글 이름 (관리용)<input name="ko" maxlength="20" value="' + esc(a.ko) + '"></label></div>' +
          '<label class="chk"><input type="checkbox" name="show"' + (a.hidden ? '' : ' checked') + '>홈페이지에 보이기</label>' : '') +
        '<label class="f">장르 (예: 블랙워크 · 리얼리즘)<input name="genre" maxlength="80" value="' + esc(a.genre) + '"></label>' +
        '<label class="f">인스타그램 (주소 또는 @아이디)<input name="ig" maxlength="200" value="' + esc(a.ig) + '"></label>' +
        '<label class="f"><span style="display:flex;justify-content:space-between">소개 글<span data-cnt></span></span><textarea name="bio" maxlength="600" placeholder="예) 섬세한 라인과 감성적인 디자인을 좋아해요. 첫 타투도 편하게 상담해 주세요.">' + esc(a.bio) + '</textarea></label>' +
        '<div class="btns"><button class="btn btn-solid">저장하기</button>' + (admin ? '<button type="button" class="btn btn-danger" data-del>이 아티스트 지우기</button>' : '') + '</div>' +
        '</form></div>' +
        '<div class="head" style="margin-top:12px"><h3 class="t">작업 사진 (최대 5장)</h3><p class="muted">손님이 사진을 누르면 뜨는 \'아티스트 창\'에서 옆으로 넘겨 볼 수 있어요. 비워 두면 대표 사진만 보여요.</p></div>' +
        '<div class="slots" data-slots></div>';
      var f = $('[data-f]', box), cnt = $('[data-cnt]', box);
      function count() { cnt.textContent = f.bio.value.length + ' / 600'; }
      f.bio.oninput = count; count();
      if (opt.back) $('[data-back]', box).onclick = opt.back;
      f.onsubmit = function (ev) {
        ev.preventDefault();
        var b = $('button', f), d = { genre: f.genre.value.trim(), ig: igUrl(f.ig.value), bio: f.bio.value.trim(), updatedAt: NOW() };
        if (admin) { d.en = f.en.value.trim().toUpperCase(); d.ko = f.ko.value.trim(); d.hidden = !f.show.checked; }
        b.disabled = true;
        ref.update(d).then(function () { f.ig.value = d.ig; bgToast('저장했어요. 홈페이지에 바로 반영돼요.'); })
          .catch(function (e) { bgToast(fail(e)); }).then(function () { b.disabled = false; });
      };
      if (admin) $('[data-del]', box).onclick = function () {
        if (!confirm(a.en + ' 아티스트를 지울까요? 사진도 같이 지워지고 되돌릴 수 없어요.\n(잠깐 숨기기만 하려면 \'홈페이지에 보이기\'를 끄세요)')) return;
        ref.collection('photos').get().then(function (q) {
          var bt = db.batch(); q.docs.forEach(function (d) { bt.delete(d.ref); }); bt.delete(ref); return bt.commit();
        }).then(function () { bgToast('지웠어요.'); opt.back && opt.back(); }).catch(function (e) { bgToast(fail(e)); });
      };
      $('[data-cf]', box).onchange = function () {
        var file = this.files[0]; this.value = ''; if (!file) return;
        loadImg(file).then(cropCover).then(function (data) {
          if (!data) return;
          bgToast('저장하는 중…');
          return ref.update({ cover: data, updatedAt: NOW() }).then(function () {
            var fr = $('[data-cv]', box); fr.style.backgroundImage = "url('" + data + "')"; fr.textContent = ''; bgToast('대표 사진을 바꿨어요.');
          });
        }).catch(function (e) { bgToast(fail(e)); });
      };
      slots($('[data-slots]', box), ref);
    }).catch(function (e) { box.innerHTML = '<div class="card"><p class="msg">' + esc(fail(e)) + '</p></div>'; });
  }
  function slots(el, ref) {
    var col = ref.collection('photos');
    col.get().then(function (q) {
      var have = {}; q.docs.forEach(function (d) { have[d.id] = d.data().data; });
      var h = '';
      ['p1', 'p2', 'p3', 'p4', 'p5'].forEach(function (p, i) {
        h += '<div class="slot"><div class="frame" style="' + bg(have[p]) + '">' + (have[p] ? '' : (i + 1)) + '</div><div class="acts">' +
          '<label class="btn btn-sm filebtn">' + (have[p] ? '바꾸기' : '+ 넣기') + '<input type="file" accept="image/*" data-p="' + p + '"></label>' +
          (have[p] ? '<button type="button" class="btn btn-sm btn-danger" data-x="' + p + '" aria-label="' + (i + 1) + '번 사진 지우기">지우기</button>' : '') + '</div></div>';
      });
      el.innerHTML = h;
      $$('[data-p]', el).forEach(function (inp) {
        inp.onchange = function () {
          var file = this.files[0], p = this.getAttribute('data-p'); this.value = ''; if (!file) return;
          bgToast('사진을 줄여서 올리는 중…');
          loadImg(file).then(function (img) { return col.doc(p).set({ data: photoData(img), updatedAt: NOW() }); })
            .then(function () { bgToast('사진을 넣었어요.'); slots(el, ref); }).catch(function (e) { bgToast(fail(e)); });
        };
      });
      $$('[data-x]', el).forEach(function (b) {
        b.onclick = function () {
          if (!confirm('이 사진을 지울까요?')) return;
          col.doc(b.getAttribute('data-x')).delete().then(function () { slots(el, ref); }).catch(function (e) { bgToast(fail(e)); });
        };
      });
    }).catch(function (e) { el.innerHTML = '<p class="msg">' + esc(fail(e)) + '</p>'; });
  }

  function showArtist() {
    app.innerHTML = bar() + '<div data-ed style="display:flex;flex-direction:column;gap:24px"></div>' +
      '<p class="muted">고친 내용은 저장하면 <a href="index.html#artists">홈페이지</a>에 바로 반영돼요.</p>';

  // ---- 4. 관리자 ----
  function showAdmin(tab) {
    tab = tab || 'users';
    app.innerHTML = bar() + '<div class="tabs" role="tablist">' +
      '<button type="button" role="tab" data-t="users">가입 승인<span class="n" data-n hidden></span></button>' +
      '<button type="button" role="tab" data-t="artists">아티스트</button>' +
      '<button type="button" role="tab" data-t="texts">페이지 문구</button>' +
      '<button type="button" role="tab" data-t="photos">페이지 사진</button></div><div data-body style="display:flex;flex-direction:column;gap:24px"></div>';
    bindBar();
    $$('[data-t]').forEach(function (b) {
      b.setAttribute('aria-selected', b.getAttribute('data-t') === tab ? 'true' : 'false');
      b.onclick = function () { showAdmin(b.getAttribute('data-t')); };
    });
    var body = $('[data-body]');
    pendingCount();
    if (tab === 'users') usersTab(body);
    if (tab === 'artists') artistsTab(body);
    if (tab === 'texts') textsTab(body);
    if (tab === 'photos') photosTab(body);
  }
  function pendingCount() {
    db.collection('users').where('role', '==', 'pending').get().then(function (q) {
      var n = $('[data-n]'); if (!n) return; n.textContent = q.size; n.hidden = !q.size;
    }).catch(function () {});
  }

  function usersTab(body) {
    body.innerHTML = '<p class="spin">불러오는 중…</p>';
    Promise.all([db.collection('users').get(), db.collection('artists').get()]).then(function (r) {
      var us = r[0].docs.map(function (d) { var o = d.data(); o.uid = d.id; return o; });
      var ar = {}; r[1].docs.forEach(function (d) { ar[d.id] = d.data(); });
      var ids = Object.keys(ar).sort(function (a, b) { return ar[a].en < ar[b].en ? -1 : 1; });
      var pend = us.filter(function (u) { return u.role === 'pending'; });
      var arts = us.filter(function (u) { return u.role === 'artist' || u.role === 'admin'; });
      function opts(sel) {
        return ids.map(function (i) { return '<option value="' + esc(i) + '"' + (i === sel ? ' selected' : '') + '>' + esc(ar[i].en) + (ar[i].ko ? ' (' + esc(ar[i].ko) + ')' : '') + '</option>'; }).join('') +
          '<option value="__new"' + (!sel || !ar[sel] ? ' selected' : '') + '>새 아티스트로 만들기</option>';
      }
      var h = '<div class="head"><h3 class="t">가입 신청</h3><p class="muted">누가 신청했는지 확인하고, 홈페이지의 어느 아티스트인지 골라 승인해 주세요. 모르는 사람이면 거절하세요.</p></div>';
      h += pend.length ? '<div class="rows">' + pend.map(function (u) {
        return '<div class="row" data-u="' + esc(u.uid) + '"><div class="who"><b>' + esc(u.name) + (u.ko ? ' · ' + esc(u.ko) : '') + '</b><span>' + esc(u.email) + '</span>' + (u.note ? '<span>“' + esc(u.note) + '”</span>' : '') + '</div>' +
          '<select class="f" aria-label="연결할 아티스트">' + opts(u.want) + '</select>' +
          '<button type="button" class="btn btn-sm btn-solid" data-ok>승인</button><button type="button" class="btn btn-sm btn-danger" data-no>거절</button></div>';
      }).join('') + '</div>' : '<p class="muted">새 신청이 없어요.</p>';
      h += '<div class="head" style="margin-top:20px"><h3 class="t">승인된 아티스트</h3></div>';
      h += arts.length ? '<div class="rows">' + arts.map(function (u) {
        var a = ar[u.artistId];
        return '<div class="row" data-u="' + esc(u.uid) + '"><div class="who"><b>' + esc(a ? a.en : u.name) + (u.role === 'admin' ? ' · 관리자' : '') + '</b><span>' + esc(u.email) + '</span></div>' +
          '<button type="button" class="btn btn-sm btn-danger" data-cut>권한 빼기</button></div>';
      }).join('') + '</div>' : '<p class="muted">아직 없어요.</p>';
      body.innerHTML = h;
      $$('[data-ok]', body).forEach(function (b) {
        b.onclick = function () {
          var row = b.closest('.row'), uid = row.getAttribute('data-u'), u = pend.filter(function (x) { return x.uid === uid; })[0];
          var sel = $('select', row).value, go = Promise.resolve(sel);
          if (sel === '__new') {
            var en = (u.name || '').toUpperCase(), id = slug(en);
            if (!id) { bgToast('활동명이 영어가 아니라서 만들 수 없어요. 아티스트 탭에서 먼저 만들어 주세요.'); return; }
            if (ar[id]) { bgToast(en + ' 이름의 아티스트가 이미 있어요. 목록에서 골라 주세요.'); return; }
            go = db.collection('artists').doc(id).set({ en: en, ko: u.ko || '', genre: '', ig: '', bio: '', hidden: true, createdAt: NOW() }).then(function () { return id; });
          }
          b.disabled = true;
          go.then(function (id) { return db.collection('users').doc(uid).update({ role: 'artist', artistId: id, approvedAt: NOW() }); })
            .then(function () { bgToast('승인했어요.' + (sel === '__new' ? ' 새 아티스트는 사진을 넣은 뒤 \'홈페이지에 보이기\'를 켜 주세요.' : '')); usersTab(body); pendingCount(); })
            .catch(function (e) { b.disabled = false; bgToast(fail(e)); });
        };
      });
      $$('[data-no]', body).forEach(function (b) {
        b.onclick = function () {
          if (!confirm('이 신청을 거절할까요?')) return;
          db.collection('users').doc(b.closest('.row').getAttribute('data-u')).delete().then(function () { usersTab(body); pendingCount(); }).catch(function (e) { bgToast(fail(e)); });
        };
      });
      $$('[data-cut]', body).forEach(function (b) {
        b.onclick = function () {
          if (!confirm('이 사람의 수정 권한을 뺄까요? (홈페이지의 아티스트 정보는 그대로 남아요)')) return;
          db.collection('users').doc(b.closest('.row').getAttribute('data-u')).delete().then(function () { usersTab(body); }).catch(function (e) { bgToast(fail(e)); });
        };
      });
    }).catch(function (e) { body.innerHTML = '<p class="msg">' + esc(fail(e)) + '</p>'; });
  }

  function artistsTab(body) {
    body.innerHTML = '<p class="spin">불러오는 중…</p>';
    db.collection('artists').get().then(function (q) {
      var list = q.docs.map(function (d) { var o = d.data(); o.id = d.id; return o; }).sort(function (a, b) { return a.en < b.en ? -1 : 1; });
      if (!list.length) {
        body.innerHTML = '<div class="card narrow"><h3 class="t">처음 한 번만 해 주세요</h3><p class="muted">지금 홈페이지에 있는 아티스트 정보(이름·장르·인스타·사진)를 관리 창고로 옮겨요.</p>' +
          '<button type="button" class="btn btn-solid wide" data-seed>홈페이지 아티스트 불러오기</button></div>';
        $('[data-seed]', body).onclick = function () { this.disabled = true; seed().then(function (n) { bgToast(n + '명을 불러왔어요.'); artistsTab(body); }).catch(function (e) { bgToast(fail(e)); }); };
        return;
      }
      body.innerHTML = '<div class="head"><h3 class="t">아티스트 ' + list.length + '명</h3><p class="muted">눌러서 사진·장르·소개를 고칠 수 있어요. 홈페이지에서는 열 때마다 순서가 섞여요.</p></div>' +
        '<div class="grid">' + list.map(function (a) {
          return '<button type="button" class="mini" data-a="' + esc(a.id) + '"><span class="fr" style="' + bg(a.cover || a.coverUrl) + '">' + (a.hidden ? '<span class="badge">숨김</span>' : '') + '</span><b>' + esc(a.en) + '</b><small>' + esc(a.genre || '장르 없음') + '</small></button>';
        }).join('') + '<button type="button" class="mini" data-new><span class="add">+ 새 아티스트</span></button></div>';
      $$('[data-a]', body).forEach(function (b) {
        b.onclick = function () { editor(body, b.getAttribute('data-a'), { back: function () { artistsTab(body); } }); };
      });
      $('[data-new]', body).onclick = function () {
        var en = (prompt('새 아티스트의 영어 이름을 적어 주세요 (예: ROSE)') || '').trim().toUpperCase(), id = slug(en);
        if (!en) return;
        if (!id) { bgToast('영어나 숫자로 적어 주세요.'); return; }
        if (list.some(function (a) { return a.id === id; })) { bgToast('같은 이름이 이미 있어요.'); return; }
        db.collection('artists').doc(id).set({ en: en, ko: '', genre: '', ig: '', bio: '', hidden: true, createdAt: NOW() })
          .then(function () { bgToast('만들었어요. 사진을 넣고 \'홈페이지에 보이기\'를 켜 주세요.'); editor(body, id, { back: function () { artistsTab(body); } }); })
          .catch(function (e) { bgToast(fail(e)); });
      };
    }).catch(function (e) { body.innerHTML = '<p class="msg">' + esc(fail(e)) + '</p>'; });
  }
  // 홈페이지(index.html)에 들어 있는 아티스트 카드를 창고로 옮기기
  function seed() {
    return fetch('index.html', { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (t) {
      var doc = new DOMParser().parseFromString(t, 'text/html'), bt = db.batch(), n = 0;
      $$('.artists .artist', doc).forEach(function (a) {
        var src = $('img', a).getAttribute('src'), id = (src.match(/([a-z0-9_-]+)\.jpg/) || [])[1];
        if (!id) return;
        var lab = $('.ph', a).getAttribute('aria-label') || '';
        bt.set(db.collection('artists').doc(id), {
          en: $('h3', a).textContent.trim(), ko: (lab.match(/^([^(]+)\(/) || [])[1] || '', genre: $('.meta p', a).textContent.trim(),
          ig: $('.ig', a).getAttribute('href'), coverUrl: src, bio: '', hidden: false, createdAt: NOW()
        });
        n++;
      });
      return bt.commit().then(function () { return n; });
    });
  }

  // ---- 페이지 사진 바꾸기 (배경·수업 사진) + 보여 줄 위치 맞추기 ----
  // pc·ph: 실제 페이지에서 그 칸의 가로÷세로 (PC·폰), ov: 페이지에서 사진 위에 덮는 어둡게 하기
  var HERO_OV = 'linear-gradient(180deg,rgba(0,0,0,.72) 0%,rgba(0,0,0,.55) 45%,rgba(0,0,0,.92) 100%)';
  var SPOTS = [
    { k: 's_hero', name: '타투 쉐어 · 맨 위 배경', src: 'share/hero.jpg', size: 1600, page: 'share.html', pc: 2.18, ph: 0.69, ov: HERO_OV },
    { k: 'a_hero', name: '타투플레이스 · 맨 위 배경', src: 'academy/hero.jpg', size: 1600, page: 'academy.html', pc: 1.88, ph: 0.53, ov: HERO_OV },
    { k: 'a_tools', name: '타투플레이스 · \'실습 위주 교육\' 배경', src: 'academy/tools.jpg', size: 1600, page: 'academy.html#course', pc: 2.15, ph: 0.67, ov: 'linear-gradient(90deg,rgba(0,0,0,.94) 0%,rgba(0,0,0,.86) 55%,rgba(0,0,0,.7) 100%)' },
    { k: 'a_class2', name: '타투플레이스 · 수업 현장 (이론 수업)', src: 'academy/class2.jpg', size: 1200, page: 'academy.html#class', pc: 4 / 3 },
    { k: 'a_class1', name: '타투플레이스 · 수업 현장 (실습 수업)', src: 'academy/class1.jpg', size: 1200, page: 'academy.html#class', pc: 4 / 3 }
  ];
  function posText(p) { return p ? Math.round(p.x) + '% ' + Math.round(p.y) + '%' : '50% 50%'; }
  // 위치 맞추기 창: 사진을 끌어서 보여 줄 곳을 정함 → {x, y} (퍼센트) 또는 취소하면 null
  function placePhoto(src, s, start) {
    return new Promise(function (done) {
      var img = new Image(), p = { x: start ? start.x : 50, y: start ? start.y : 50, z: start && start.z ? start.z : 1 };
      var d = document.createElement('div'); d.className = 'crop';
      function frame(r, label, cls) {
        return '<div class="pp ' + cls + '"><span class="pp-l">' + label + '</span><div class="pp-f" style="aspect-ratio:' + r + '">' +
          (s.ov ? '<i style="background:' + s.ov + '"></i>' : '') + '</div></div>';
      }
      d.innerHTML = '<div class="card wide-card"><h3 class="t">보여 줄 곳 맞추기</h3>' +
        '<p class="muted">사진을 끌어서 보여 주고 싶은 곳을 맞추고, 아래 막대로 크기를 조절하세요. (폰에서는 두 손가락으로 벌리거나 오므려도 돼요)' + (s.ph ? ' PC와 폰은 화면 모양이 달라서 잘리는 곳이 달라요. 두 화면 다 확인해 주세요.' : '') + '</p>' +
        '<div class="pp-row">' + frame(s.pc, 'PC 화면', 'pp-pc') + (s.ph ? frame(s.ph, '폰 화면', 'pp-ph') : '') + '</div>' +
        '<label class="f"><span>크기 <span data-zt></span></span><input type="range" min="1" max="3" step="0.01" data-z></label>' +
        '<p class="warn" data-same hidden>사진 모양이 칸 모양과 같아서 이대로는 옮길 곳이 없어요. 크기를 키우면 옮길 수 있어요.</p>' +
        '<div class="btns"><button type="button" class="btn btn-solid" data-ok>이 위치로 저장</button><button type="button" class="btn" data-mid>처음대로</button><button type="button" class="btn" data-no>취소</button></div></div>';
      document.body.appendChild(d);
      var fs = $$('.pp-f', d), zr = $('[data-z]', d);
      // 칸 크기에서 사진이 차지하는 크기 (꽉 채우기 × 크기)
      function geo(f) {
        var W = f.clientWidth, H = f.clientHeight, r = Math.max(W / img.naturalWidth, H / img.naturalHeight) * p.z;
        return { w: img.naturalWidth * r, h: img.naturalHeight * r, ox: img.naturalWidth * r - W, oy: img.naturalHeight * r - H };
      }
      function draw() {
        fs.forEach(function (f) {
          var g = geo(f);
          f.style.backgroundImage = 'url("' + src + '")';
          f.style.backgroundSize = Math.ceil(g.w) + 'px ' + Math.ceil(g.h) + 'px';
          f.style.backgroundPosition = posText(p);
        });
        zr.value = p.z; $('[data-zt]', d).textContent = '· ' + p.z.toFixed(1) + '배';
        $('[data-same]', d).hidden = fs.some(function (f) { var g = geo(f); return g.ox > 2 || g.oy > 2; });
      }
      function setZ(z) { p.z = Math.round(Math.min(3, Math.max(1, z)) * 100) / 100; draw(); }
      img.onload = function () {
        draw();
        zr.oninput = function () { setZ(+zr.value); };
        fs.forEach(function (f) {
          var pts = {}, drag = null, pinch = null;
          function dist() { var a = Object.keys(pts).map(function (k) { return pts[k]; }); return Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y); }
          f.addEventListener('pointerdown', function (e) {
            pts[e.pointerId] = { x: e.clientX, y: e.clientY }; f.setPointerCapture(e.pointerId); e.preventDefault();
            var n = Object.keys(pts).length;
            if (n === 1) drag = { x: e.clientX, y: e.clientY, px: p.x, py: p.y };
            if (n === 2) { drag = null; pinch = { d: dist(), z: p.z }; }
          });
          f.addEventListener('pointermove', function (e) {
            if (!pts[e.pointerId]) return;
            pts[e.pointerId] = { x: e.clientX, y: e.clientY };
            if (pinch && Object.keys(pts).length === 2) { setZ(pinch.z * dist() / (pinch.d || 1)); return; }
            if (!drag) return;
            var g = geo(f);
            if (g.ox > 1) p.x = Math.min(100, Math.max(0, drag.px - (e.clientX - drag.x) / g.ox * 100));
            if (g.oy > 1) p.y = Math.min(100, Math.max(0, drag.py - (e.clientY - drag.y) / g.oy * 100));
            draw();
          });
          function up(e) { delete pts[e.pointerId]; pinch = null; drag = null; }
          f.addEventListener('pointerup', up);
          f.addEventListener('pointercancel', up);
          // PC: 마우스 휠로도 크기 조절
          f.addEventListener('wheel', function (e) { e.preventDefault(); setZ(p.z * (e.deltaY < 0 ? 1.08 : 1 / 1.08)); }, { passive: false });
        });
      };
      img.src = src;
      $('[data-mid]', d).onclick = function () { p = { x: 50, y: 50, z: 1 }; draw(); };
      $('[data-ok]', d).onclick = function () { d.remove(); done({ x: Math.round(p.x), y: Math.round(p.y), z: p.z }); };
      $('[data-no]', d).onclick = function () { d.remove(); done(null); };
    });
  }
  function photosTab(body) {
    body.innerHTML = '<div class="head"><h3 class="t">페이지 사진 바꾸기</h3><p class="muted">\'사진 바꾸기\'로 새 사진을 고르면 보여 줄 곳을 맞추는 창이 떠요. 이미 있는 사진은 \'위치 맞추기\'로 보이는 곳만 바꿀 수 있어요. 배경 사진은 글씨가 잘 보이도록 홈페이지에서 자동으로 어둡게 보여요. \'원래대로\'를 누르면 처음 사진·가운데 위치로 돌아가요.</p></div><div data-list><p class="spin">불러오는 중…</p></div>';
    var idx = db.collection('site').doc('photos'), col = db.collection('pagePhotos');
    Promise.all([idx.get()].concat(SPOTS.map(function (s) { return col.doc(s.k).get(); }))).then(function (r) {
      var info = r[0].exists ? r[0].data() : {}, v = info.v || {}, pos = info.pos || {}, h = '<div class="rows">', mine = {};
      SPOTS.forEach(function (s, i) {
        var d = r[i + 1]; mine[s.k] = d.exists && v[s.k] ? d.data().data : '';
        var changed = mine[s.k] || pos[s.k];
        h += '<div class="row" data-s="' + s.k + '"><div class="frame" style="flex:0 0 160px;aspect-ratio:4/3;' + bg(mine[s.k] || s.src) + ';background-position:' + posText(pos[s.k]) + '"></div>' +
          '<div class="who"><b>' + esc(s.name) + '</b><span>' + (mine[s.k] ? '바꾼 사진' : '처음 사진') + (pos[s.k] ? ' · 위치 맞춤' + (pos[s.k].z > 1 ? ' · ' + (+pos[s.k].z).toFixed(1) + '배' : '') : '') + ' · <a href="' + s.page + '" target="_blank" rel="noopener" style="color:#9C978F">페이지에서 보기</a></span></div>' +
          '<label class="btn btn-sm btn-solid filebtn">사진 바꾸기<input type="file" accept="image/*"></label>' +
          '<button type="button" class="btn btn-sm" data-pos>위치 맞추기</button>' +
          (changed ? '<button type="button" class="btn btn-sm" data-undo>원래대로</button>' : '') + '</div>';
      });
      $('[data-list]', body).innerHTML = h + '</div>';
      function savePos(k, p, extra) {
        var o = { pos: {} }; o.pos[k] = p;
        if (extra) { o.v = {}; o.v[k] = Date.now(); }
        return idx.set(o, { merge: true });
      }
      SPOTS.forEach(function (s) {
        var row = $('[data-s="' + s.k + '"]', body);
        $('input', row).onchange = function () {
          var file = this.files[0], data; this.value = ''; if (!file) return;
          loadImg(file).then(function (img) {
            data = photoData(img, s.size);
            return placePhoto(data, s, null);
          }).then(function (p) {
            if (!p) return;
            bgToast('사진을 올리는 중…');
            return col.doc(s.k).set({ data: data, updatedAt: NOW() })
              .then(function () { return savePos(s.k, p, true); })
              .then(function () { bgToast('바꿨어요. 페이지를 새로고침하면 보여요.'); photosTab(body); });
          }).catch(function (e) { bgToast(fail(e)); });
        };
        $('[data-pos]', row).onclick = function () {
          placePhoto(mine[s.k] || s.src, s, pos[s.k]).then(function (p) {
            if (!p) return;
            return savePos(s.k, p).then(function () { bgToast('위치를 맞췄어요. 페이지를 새로고침하면 보여요.'); photosTab(body); });
          }).catch(function (e) { bgToast(fail(e)); });
        };
        var u = $('[data-undo]', row);
        if (u) u.onclick = function () {
          if (!confirm('처음 사진·가운데 위치로 되돌릴까요?')) return;
          var f = {}, del = firebase.firestore.FieldValue.delete();
          f['v.' + s.k] = del; f['pos.' + s.k] = del;
          idx.update(f).then(function () { return mine[s.k] ? col.doc(s.k).delete() : null; })
            .then(function () { bgToast('처음대로 되돌렸어요.'); photosTab(body); }).catch(function (e) { bgToast(fail(e)); });
        };
      });
    }).catch(function (e) { $('[data-list]', body).innerHTML = '<p class="msg">' + esc(fail(e)) + '</p>'; });
  }

  // 글자 칸 → 고치기용 글자 (굵게는 **, 줄바꿈 그대로)
  function toText(el) {
    var c = el.cloneNode(true);
    $$('br', c).forEach(function (b) { b.replaceWith('\n'); });
    $$('b,strong', c).forEach(function (b) { b.replaceWith('**' + b.textContent + '**'); });
    return c.textContent.replace(/[ \t\r]*\n[ \t\r]*/g, '\n').replace(/[ \t\r]+/g, ' ').trim();
  }
  function textsTab(body, page) {
    page = page || PAGES[0][0];
    body.innerHTML = '<div class="head"><h3 class="t">페이지 문구 고치기</h3><p class="muted">고칠 글을 바꾸고 맨 아래 \'저장하기\'를 누르세요. <b style="color:#F2EFEA">**이렇게**</b> 감싸면 굵은 글씨, 줄을 바꾸면 홈페이지에서도 줄이 바뀌어요. 전화번호·링크·주소 버튼은 여기서 못 고쳐요 (말씀해 주세요).</p></div>' +
      '<div class="tabs">' + PAGES.map(function (p) { return '<button type="button" data-pg="' + p[0] + '" aria-selected="' + (p[0] === page) + '">' + p[1] + '</button>'; }).join('') + '</div>' +
      '<div data-list><p class="spin">불러오는 중…</p></div>';
    $$('[data-pg]', body).forEach(function (b) { b.onclick = function () { textsTab(body, b.getAttribute('data-pg')); }; });
    var ref = db.collection('site').doc('texts'), all = {};
    Promise.all([fetch(page, { cache: 'no-store' }).then(function (r) { return r.text(); }), ref.get()]).then(function (r) {
      var doc = new DOMParser().parseFromString(r[0], 'text/html');
      all = (r[1].exists && r[1].data().texts) || {};
      var h = '', last = null, rows = [];
      $$('[data-edit]', doc).forEach(function (el) {
        var k = el.getAttribute('data-edit'), sec = el.closest('section'), h2 = sec && $('h2', sec);
        var name = sec && sec.id === 'top' ? '맨 위' : h2 ? h2.textContent.trim() : '기타';
        if (name !== last) { h += '<p class="sec-label">' + esc(name) + '</p>'; last = name; }
        var def = toText(el), v = typeof all[k] === 'string' ? all[k] : def;
        rows.push({ k: k, def: def });
        h += '<div class="txt-row' + (v !== def ? ' changed' : '') + '" data-k="' + k + '"><div class="k"><span>' + k + '</span>' +
          '<button type="button" class="link" data-reset' + (v !== def ? '' : ' hidden') + '>원래대로</button></div>' +
          '<label class="f"><textarea rows="' + Math.max(1, Math.ceil(v.length / 48) + (v.split('\n').length - 1)) + '" aria-label="' + esc(name) + ' 문구">' + esc(v) + '</textarea></label></div>';
      });
      h += '<div class="sticky"><button type="button" class="btn btn-solid" data-save>저장하기</button><span class="muted" data-st></span></div>';
      var list = $('[data-list]', body); list.innerHTML = h;
      var defs = {}; rows.forEach(function (x) { defs[x.k] = x.def; });
      $$('.txt-row', list).forEach(function (row) {
        var k = row.getAttribute('data-k'), ta = $('textarea', row), rs = $('[data-reset]', row);
        ta.oninput = function () { var ch = ta.value.trim() !== defs[k]; row.classList.toggle('changed', ch); rs.hidden = !ch; $('[data-st]', list).textContent = '저장 안 한 내용이 있어요'; };
        rs.onclick = function () { ta.value = defs[k]; ta.oninput(); };
      });
      $('[data-save]', list).onclick = function () {
        var b = this, next = {};
        Object.keys(all).forEach(function (k) { next[k] = all[k]; });
        $$('.txt-row', list).forEach(function (row) {
          var k = row.getAttribute('data-k'), v = $('textarea', row).value.trim();
          if (v === defs[k] || !v) delete next[k]; else next[k] = v;
        });
        b.disabled = true;
        ref.set({ texts: next, updatedAt: NOW() }).then(function () {
          all = next; $('[data-st]', list).textContent = ''; bgToast('저장했어요. 홈페이지를 새로고침하면 보여요.');
        }).catch(function (e) { bgToast(fail(e)); }).then(function () { b.disabled = false; });
      };
    }).catch(function (e) { $('[data-list]', body).innerHTML = '<p class="msg">' + esc(fail(e)) + '</p>'; });
  }

  // 다른 페이지 메뉴가 '관리'/'마이페이지'로 바뀌도록 적어 둠
  function setWho(w) {
    try { if (w) localStorage.setItem('bg-who', w); else localStorage.removeItem('bg-who'); } catch (e) {}
    if (window.bgNav) window.bgNav(w);
  }

  // ---- 누구인지 보고 맞는 화면으로 ----
  function route() {
    if (!user) { setWho(''); return showLogin(); }
    app.innerHTML = '<p class="spin">불러오는 중…</p>';
    admin = (user.email || '').toLowerCase() === ADMIN && user.emailVerified;
    db.collection('users').doc(user.uid).get().then(function (s) {
      me = s.exists ? s.data() : null;
      if (me && me.role === 'admin') admin = true;
      setWho(admin ? 'admin' : 'artist');
      if (admin) return showAdmin();
      if (!me) return showApply();
      if (me.role === 'artist' && me.artistId) return showArtist();
      showPending();
    }).catch(function (e) {
      app.innerHTML = bar() + '<div class="card narrow"><p class="msg">' + esc(fail(e)) + '</p></div>'; bindBar();
    });
  }
  // 메뉴의 '로그아웃' (login.html?logout=1&back=보던 페이지)
  var qs = new URLSearchParams(location.search);
  if (qs.get('logout')) {
    var back = qs.get('back');
    setWho('');
    app.innerHTML = '<p class="spin">로그아웃하는 중…</p>';
    auth.signOut().then(function () {
      location.replace(PAGES.some(function (p) { return p[0] === back; }) ? back : 'login.html');
    });
    return;
  }
  auth.getRedirectResult().catch(function (e) { bgToast(fail(e)); });
  auth.onAuthStateChanged(function (u) { user = u; me = null; admin = false; route(); });
})();
</script>
